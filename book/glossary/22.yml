- term: Data ethics
  th: จริยธรรมข้อมูล
  definition: >
    หลักการที่ใช้ตัดสินใจเรื่องการเก็บ ใช้ และสื่อสารข้อมูล ได้แก่ การเคารพบุคคล ประโยชน์และไม่ก่ออันตราย
    ความยุติธรรม และการเคารพกฎหมายกับประโยชน์สาธารณะ
  section: sec-ch22-principles
- term: Environmental justice
  th: ความยุติธรรมเชิงสิ่งแวดล้อม
  definition: >
    แนวคิดว่าภาระของมลพิษและประโยชน์ของการเฝ้าระวังควรกระจายอย่างเป็นธรรม ไม่ตกกับกลุ่มที่มีอำนาจต่อรองน้อย
  section: sec-ch22-principles
- term: FAIR principles
  th: หลัก FAIR
  definition: >
    หลักการดูแลข้อมูลทางวิชาการให้ค้นพบได้ เข้าถึงได้ ทำงานร่วมกันได้ และนำกลับมาใช้ได้
  section: sec-ch22-principles
- term: Bias
  th: อคติ
  definition: >
    ความคลาดเคลื่อนอย่างเป็นระบบในทิศทางเดียว ทั้งในข้อมูล เช่น การเลือกและการวัด และในการตีความ
    เช่น การยืนยันสิ่งที่เชื่อ ไม่ลดลงเมื่อเพิ่มข้อมูล
  section: sec-ch22-bias
  see_also: [Automation bias]
- term: Automation bias
  th: การเชื่อระบบอัตโนมัติ
  definition: >
    แนวโน้มที่จะเชื่อผลจากเครื่องมืออัตโนมัติหรือ AI มากเกินไป และตรวจสอบน้อยลง
  section: sec-ch22-bias
- term: Hallucination
  th: hallucination
  definition: >
    การที่แบบจำลองภาษาสร้างข้อมูลที่ไม่มีอยู่จริงอย่างมั่นใจ เช่น ชื่อคอลัมน์ ฟังก์ชัน แพ็กเกจ หรือแหล่งอ้างอิงที่ไม่มีจริง
  section: sec-ch22-ai
- term: License
  th: สัญญาอนุญาต
  definition: >
    การที่เจ้าของสิทธิอนุญาตให้ผู้อื่นใช้งานภายใต้เงื่อนไขที่กำหนด งานที่ไม่มีสัญญาอนุญาตไม่ได้แปลว่าใช้ได้อิสระ
  section: sec-ch22-licenses
  see_also: [Copyleft]
- term: Copyleft
  th: copyleft
  definition: >
    สัญญาอนุญาตที่กำหนดให้งานที่ดัดแปลงหรือรวมจากงานนั้นเมื่อแจกจ่ายต้องใช้สัญญาเดียวกัน เช่น GPL และ ODbL
  section: sec-ch22-licenses
- term: Questionable research practices
  th: แนวปฏิบัติการวิจัยที่น่าสงสัย
  definition: >
    แนวปฏิบัติที่ไม่ถึงขั้นปลอมหรือบิดเบือนข้อมูล แต่ทำให้ผลเชื่อถือได้น้อยลง เช่น รายงานเฉพาะการวิเคราะห์ที่ได้ผล
    หรือเปลี่ยนเกณฑ์หลังเห็นข้อมูล
  section: sec-ch22-integrity
  see_also: [HARKing]
