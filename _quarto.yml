project:
  type: website
  render:
    - index.qmd
    - syllabus.md
    - weeks/*/*.md
    - slides/*.qmd

website:
  title: "Data Science Toolbox"
  repo-url: https://github.com/popotaroman-cloud/data-science-toolbox
  repo-actions: [source]
  sidebar:
    style: docked
    search: true
    contents:
      - text: "หน้าแรก"
        href: index.qmd
      - syllabus.md
      - section: "เอกสารประกอบการสอน"
        contents: "weeks/*/index.md"
      - section: "คู่มือปฏิบัติการ"
        contents:
          - text: "ปฏิบัติการสัปดาห์ที่ 1"
            href: weeks/week01/lab.md
          - text: "ปฏิบัติการสัปดาห์ที่ 2"
            href: weeks/week02/lab.md
