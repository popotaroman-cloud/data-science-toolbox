- term: Datum
  th: datum
  definition: >
    การผูก ellipsoid เข้ากับโลกจริง พิกัดตัวเลขเดียวกันบน datum ต่างกันหมายถึงตำแหน่งต่างกัน
    เช่น WGS 84 กับ Indian 1975
  section: sec-ch17-geodesy
- term: Coordinate Reference System (CRS)
  th: ระบบพิกัดอ้างอิง
  definition: >
    ข้อกำหนดที่บอกว่าตัวเลขพิกัดหมายถึงตำแหน่งใด ประกอบด้วย datum ระบบพิกัด และหน่วย อ้างอิงด้วยรหัส EPSG
    เช่น EPSG:4326 และ EPSG:32647
  section: sec-ch17-crs
  see_also: [Projection, Datum]
- term: Projection
  th: เส้นโครงแผนที่
  definition: >
    วิธีแปลงพื้นผิวโค้งของโลกเป็นระนาบ ทุกเส้นโครงบิดเบือนพื้นที่ รูปร่าง ระยะทาง หรือทิศทางอย่างใดอย่างหนึ่ง
  section: sec-ch17-crs
- term: UTM
  th: UTM
  definition: >
    ระบบพิกัดฉายที่แบ่งโลกเป็น 60 โซนกว้าง 6 องศา ประเทศไทยอยู่ในโซน 47N และ 48N
    มีหน่วยเป็นเมตร เหมาะกับการคำนวณระยะทางและพื้นที่
  section: sec-ch17-crs
- term: GeoDataFrame
  th: GeoDataFrame
  definition: >
    DataFrame ของ GeoPandas ที่มีคอลัมน์ geometry และ CRS กำกับ ใช้เก็บและดำเนินการกับข้อมูล vector
  section: sec-ch17-vector
- term: Spatial join
  th: spatial join
  definition: >
    การเชื่อมตารางด้วยความสัมพันธ์เชิงพื้นที่ เช่น จุดอยู่ใน polygon ใด แทนการใช้ key
    ใช้ทั้งเพิ่มข้อมูลและตรวจคุณภาพ
  section: sec-ch17-spatial-join
- term: Voronoi polygon
  th: Voronoi polygon
  definition: >
    การแบ่งพื้นที่ที่ทุกจุดใน polygon ใกล้สถานีของ polygon นั้นมากกว่าสถานีอื่น ใช้บอกพื้นที่ที่แต่ละสถานีเป็นตัวแทน
  section: sec-ch17-spatial-join
- term: Choropleth map
  th: แผนที่ choropleth
  definition: >
    แผนที่ที่ระบายสีพื้นที่ตามค่าสถิติของพื้นที่นั้น ต้องใช้อัตราแทนค่านับ แสดงพื้นที่ไม่มีข้อมูล และระวัง MAUP
  section: sec-ch17-choropleth
  see_also: [MAUP]
- term: MAUP
  th: MAUP
  definition: >
    Modifiable Areal Unit Problem ปรากฏการณ์ที่ผลการวิเคราะห์ขึ้นกับระดับและวิธีแบ่งหน่วยพื้นที่ที่ใช้รวมข้อมูล
  section: sec-ch17-choropleth
  see_also: [Ecological fallacy]
- term: Spatial autocorrelation
  th: สหสัมพันธ์เชิงพื้นที่
  definition: >
    ระดับที่ค่าที่อยู่ใกล้กันคล้ายกันมากกว่าที่คาดจากการสุ่ม วัดด้วย Moran's I ทำให้หน่วยที่อยู่ใกล้กันไม่เป็นอิสระต่อกัน
  section: sec-ch17-moran
- term: Inverse distance weighting (IDW)
  th: IDW
  definition: >
    การประมาณค่าที่ตำแหน่งหนึ่งด้วยค่าเฉลี่ยของสถานีที่ถ่วงน้ำหนักด้วยส่วนกลับของระยะทางยกกำลัง p
  section: sec-ch17-interpolation
  see_also: [Kriging]
- term: Kriging
  th: kriging
  definition: >
    วิธีประมาณค่าเชิงพื้นที่ที่ใช้ semivariogram หาค่าประมาณเชิงเส้นที่ไม่เอนเอียงและมีความแปรปรวนต่ำสุด
    และให้ความแปรปรวนของการประมาณด้วย
  section: sec-ch17-interpolation
