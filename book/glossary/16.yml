- term: PDPA
  th: พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562
  definition: >
    กฎหมายไทยที่กำหนดกติกาการเก็บรวบรวม ใช้ และเปิดเผยข้อมูลส่วนบุคคล และสิทธิของเจ้าของข้อมูล
    มีผลใช้บังคับเต็มรูปแบบตั้งแต่ 1 มิถุนายน พ.ศ. 2565
  section: sec-ch16-pdpa
- term: Personal data
  th: ข้อมูลส่วนบุคคล
  definition: >
    ข้อมูลเกี่ยวกับบุคคลที่ทำให้ระบุตัวบุคคลนั้นได้ไม่ว่าทางตรงหรือทางอ้อม ไม่รวมข้อมูลของผู้ถึงแก่กรรมโดยเฉพาะ
  section: sec-ch16-personal-data
  see_also: [Quasi-identifier, Sensitive data]
- term: Sensitive data
  th: ข้อมูลส่วนบุคคลที่มีความอ่อนไหว
  definition: >
    ข้อมูลส่วนบุคคลตามมาตรา 26 เช่น ข้อมูลสุขภาพ พันธุกรรม ชีวภาพ ศาสนา ประวัติอาชญากรรม
    ต้องได้รับความยินยอมโดยชัดแจ้ง เว้นแต่เข้าข้อยกเว้นตามกฎหมาย
  section: sec-ch16-personal-data
- term: Quasi-identifier
  th: ตัวระบุทางอ้อม
  definition: >
    คอลัมน์ที่ระบุตัวไม่ได้เมื่ออยู่ลำพัง แต่ระบุตัวได้เมื่อรวมกันหรือเชื่อมกับข้อมูลอื่น เช่น อายุ เพศ ตำบล วันที่
  section: sec-ch16-personal-data
- term: Pseudonymization
  th: การแฝงข้อมูล
  definition: >
    การแทนตัวระบุด้วยรหัสโดยมีกุญแจหรือตารางจับคู่เก็บแยก ย้อนกลับได้ จึงยังเป็นข้อมูลส่วนบุคคล
  section: sec-ch16-anonymization
  see_also: [Anonymization]
- term: Anonymization
  th: การทำให้เป็นข้อมูลนิรนาม
  definition: >
    การทำให้ข้อมูลระบุตัวบุคคลไม่ได้อีกด้วยวิธีที่สมเหตุสมผลใด ๆ ถ้าทำได้จริงข้อมูลไม่เป็นข้อมูลส่วนบุคคลแล้ว
    แต่ทำได้ยากกว่าการลบชื่อมาก
  section: sec-ch16-anonymization
- term: Re-identification
  th: การระบุตัวตนซ้ำ
  definition: >
    การระบุว่าแถวในข้อมูลที่ "ทำให้นิรนามแล้ว" เป็นของบุคคลใด มักทำด้วยการเชื่อมตัวระบุทางอ้อมกับข้อมูลภายนอก
  section: sec-ch16-k-anonymity
- term: k-anonymity
  th: k-anonymity
  definition: >
    เงื่อนไขที่ทุกชุดค่าของตัวระบุทางอ้อมต้องปรากฏอย่างน้อย k แถว แต่ละคนจึงซ่อนอยู่ในกลุ่มอย่างน้อย k คน
  section: sec-ch16-k-anonymity
  see_also: [l-diversity]
- term: l-diversity
  th: l-diversity
  definition: >
    เงื่อนไขเพิ่มจาก k-anonymity ที่แต่ละกลุ่มต้องมีค่าของข้อมูลที่เป็นประเด็นแตกต่างกันอย่างน้อย l ค่า
    เพื่อป้องกัน homogeneity attack
  section: sec-ch16-k-anonymity
- term: Differential privacy
  th: differential privacy
  definition: >
    นิยามความเป็นส่วนตัวที่จำกัดว่าผลลัพธ์เปลี่ยนได้ไม่เกิน e^ε เท่าเมื่อเพิ่มหรือลบคนหนึ่งคน
    ทำได้ด้วยการเพิ่มสัญญาณรบกวนที่ควบคุมได้ งบประมาณสะสมเมื่อเผยแพร่หลายครั้ง
  section: sec-ch16-dp
- term: Synthetic data
  th: ข้อมูลสังเคราะห์
  definition: >
    ข้อมูลที่สร้างด้วยอัลกอริทึมแทนการเก็บจากเหตุการณ์จริง แบบกฎใช้ทดสอบโค้ด แบบที่เรียนจากข้อมูลจริง
    ต้องประเมินทั้งประโยชน์ใช้สอยและความเป็นส่วนตัว
  section: sec-ch16-synthetic
  see_also: [Gaussian copula]
- term: Gaussian copula
  th: Gaussian copula
  definition: >
    แบบจำลองที่แยกการแจกแจงขอบของแต่ละตัวแปรออกจากโครงสร้างความสัมพันธ์ แล้วบรรยายความสัมพันธ์ด้วยการแจกแจงปกติหลายตัวแปร
  section: sec-ch16-synthetic
- term: SMOTE
  th: SMOTE
  definition: >
    วิธีสร้างตัวอย่างกลุ่มน้อยด้วยการประมาณค่าในช่วงระหว่างตัวอย่างกับเพื่อนบ้าน ใช้กับชุดฝึกเท่านั้น
    ไม่ใช่เครื่องมือความเป็นส่วนตัว
  section: sec-ch16-smote
