- term: Data ethics
  th: จริยธรรมข้อมูล
  definition: >
    สาขาที่ศึกษาปัญหาทางศีลธรรมเกี่ยวกับข้อมูล อัลกอริทึม และแนวปฏิบัติในการใช้ข้อมูล
    ต่อยอดจากหลักความเคารพในบุคคล การให้ประโยชน์ และความยุติธรรม
  section: sec-ch22-principles
  see_also: [Bias (data)]

- term: Bias (data)
  th: อคติ
  definition: >
    ความคลาดเคลื่อนเชิงระบบที่ทำให้ผลการวิเคราะห์เอนไปทางใดทางหนึ่ง เกิดได้จากการเลือกตัวอย่าง
    การวัด ข้อมูลสูญหาย การรวมข้อมูล การตีความ และการรายงาน
  section: sec-ch22-bias
  see_also: [Data ethics, MCAR / MAR / MNAR]

- term: Hallucination (AI)
  th: hallucination
  definition: >
    การที่แบบจำลองภาษาสร้างเนื้อหาที่ดูน่าเชื่อถือแต่ไม่ถูกต้องหรือไม่มีอยู่จริง เช่น ชื่อคอลัมน์
    ฟังก์ชัน endpoint หรือแพ็กเกจที่ไม่มีจริง ต้องตรวจด้วยการรันกับข้อมูลจริงเสมอ
  section: sec-ch22-ai
  see_also: [Data ethics]

- term: License
  th: สัญญาอนุญาต
  definition: >
    เงื่อนไขที่เจ้าของงานกำหนดสำหรับการใช้ ดัดแปลง และเผยแพร่ต่อ เช่น CC BY สำหรับข้อมูล
    MIT และ GPL สำหรับซอฟต์แวร์ ต้องตรวจและบันทึกสำหรับทุกแหล่งที่ใช้
  section: sec-ch22-licenses
  see_also: [Data ethics]

- term: Academic integrity
  th: ความซื่อตรงทางวิชาการ
  definition: >
    การทำงานวิชาการอย่างซื่อตรง ไม่สร้างข้อมูลเท็จ ไม่บิดเบือนข้อมูล ไม่ลอกเลียนผลงาน
    ในงานข้อมูลรวมถึงการติดป้ายข้อมูลสังเคราะห์และการบันทึกการใช้ AI
  section: sec-ch22-integrity
  see_also: [Data ethics, Synthetic data]
