          - text: "ปฏิบัติการสัปดาห์ที่ 10"
            href: weeks/week10/lab.md
          - text: "ปฏิบัติการสัปดาห์ที่ 11"
            href: weeks/week11/lab.md
          - text: "ปฏิบัติการสัปดาห์ที่ 12"
            href: weeks/week12/lab.md
          - text: "ปฏิบัติการสัปดาห์ที่ 13"
