language:
  crossref-fig-title: "ภาพที่"
  crossref-fig-prefix: "ภาพที่"
  crossref-tbl-title: "ตารางที่"
  crossref-tbl-prefix: "ตารางที่"
  crossref-eq-prefix: "สมการ"
  crossref-sec-prefix: "หัวข้อ"
  section-title-references: "เอกสารอ้างอิง"
  toc-title-document: "สารบัญ"
  toc-title-website: "ในหน้านี้"
  search-no-results-text: "ไม่พบผลลัพธ์"
  code-tools-show-all-code: "แสดงโค้ดทั้งหมด"

format:
  html:
    theme: cosmo
    toc: true
    lang: th
    mainfont: "Sarabun, sans-serif"
    code-copy: true
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
