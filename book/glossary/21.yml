- term: Architecture decision record
  th: บันทึกการตัดสินใจออกแบบ
  definition: >
    เอกสารสั้นที่บันทึกการตัดสินใจออกแบบหนึ่งข้อ พร้อมบริบท ทางเลือกที่พิจารณา เหตุผล และข้อแลกเปลี่ยน
  section: sec-ch21-architecture
- term: Data lineage
  th: ลำดับวงศ์ของข้อมูล
  definition: >
    ความสัมพันธ์ที่บอกว่าแต่ละตารางสร้างจากตารางใด ด้วยโค้ดใด ใช้หาสาเหตุของตัวเลขที่ผิดและรู้ว่าต้องรันขั้นใดใหม่
  section: sec-ch21-architecture
  see_also: [Pipeline]
- term: Sensitivity analysis
  th: การวิเคราะห์ความไว
  definition: >
    การคำนวณคำตอบซ้ำภายใต้การตัดสินใจหลายแบบ เช่น เกณฑ์ความครบถ้วนต่างกัน เพื่อดูว่าข้อสรุปมั่นคงหรือขึ้นกับการตัดสินใจนั้น
  section: sec-ch21-case
