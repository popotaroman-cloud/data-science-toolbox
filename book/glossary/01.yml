- term: Data science
  th: วิทยาการข้อมูล
  definition: >
    การนำข้อมูลมาตอบคำถามอย่างเป็นระบบ โดยใช้สถิติศาสตร์จัดการความไม่แน่นอน
    ใช้การคำนวณจัดการปริมาณและความซับซ้อนของข้อมูล และใช้ความรู้เชิงโดเมนตั้งคำถามและตีความผล
  section: sec-ch01-what-is-ds
  see_also: [Domain knowledge]

- term: Domain knowledge
  th: ความรู้เชิงโดเมน
  definition: >
    ความรู้เกี่ยวกับเรื่องที่ข้อมูลวัด เช่น วิทยาศาสตร์คุณภาพอากาศ
    ช่วยตั้งคำถามที่มีความหมาย แยกเหตุการณ์จริงออกจากความผิดพลาดของการวัด และตีความผลให้ถูกต้อง
  section: sec-ch01-what-is-ds

- term: Exploratory Data Analysis (EDA)
  th: การสำรวจข้อมูล
  definition: >
    กระบวนการทำความรู้จักข้อมูลก่อนสรุปผล ด้วยกราฟ ตารางสรุป และการแปลงข้อมูล
    เพื่อหาเบาะแสและสร้างข้อสันนิษฐาน แนวคิดของ John Tukey ซึ่งเปรียบงานนี้กับงานนักสืบ
  section: sec-ch01-tukey
  see_also: [Confirmatory analysis]

- term: Confirmatory analysis
  th: การวิเคราะห์เชิงยืนยัน
  definition: >
    การทดสอบข้อสันนิษฐานที่กำหนดไว้ล่วงหน้าด้วยวิธีที่วางแผนไว้ เพื่อสรุปผลพร้อมระดับความไม่แน่นอน
    ควรใช้ข้อมูลคนละชุดกับที่ใช้สำรวจเพื่อสร้างข้อสันนิษฐานนั้น
  section: sec-ch01-eda-cda
  see_also: [Exploratory Data Analysis (EDA)]

- term: Data lifecycle
  th: วงจรชีวิตข้อมูล
  definition: >
    ลำดับขั้นที่ข้อมูลผ่านตั้งแต่ตั้งคำถาม ได้มา จัดเก็บ แปลงรูป ตรวจคุณภาพ สำรวจ จนถึงสื่อสารผล
    เป็นวงจรที่ย้อนกลับได้ เช่น CRISP-DM และ OSEMN
  section: sec-ch01-lifecycle
  see_also: [Pipeline]
