[project]
name = "dstoolbox"
version = "2569.2"
description = "สภาพแวดล้อมของรายวิชา 1145100 Data Science Toolbox"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jupyterlab",
    "ipykernel",
    "requests",
    "truststore",
    "python-dotenv",
    "beautifulsoup4",
    "duckdb>=1.4,<2",
    "pyarrow",
    "pandas",
    "polars",
    "ydata-profiling",
    "pandera",
    "skimpy",
    "missingno",
    "seaborn",
    "altair",
    "vl-convert-python",
    "plotly",
    "pygwalker",
    "datashader",
    "scipy",
    "statsmodels",
    "pingouin",
    "scikit-learn",
    "umap-learn",
    "pyod",
    "imbalanced-learn",
    "faker",
    "sdv",
    "geopandas",
    "folium",
    "streamlit",
]

[tool.uv]
package = false
