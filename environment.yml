name: dstoolbox
channels:
  - conda-forge
dependencies:
  - python=3.12
  # environment & notebooks
  - jupyterlab
  - ipykernel
  - nbstripout            # ลบผลลัพธ์ notebook ก่อน commit (บทที่ 3)
  - jupytext
  - pytest                # ทดสอบฟังก์ชันและแอป (บทที่ 20, ภาคผนวก ก)
  - ruff
  # data acquisition
  - requests
  - truststore            # แก้ปัญหา SSL certificate ของ Air4Thai
  - python-dotenv
  - beautifulsoup4
  # storage & query
  - python-duckdb>=1.5,<2   # ทั้งชั้นใช้เวอร์ชันหลักเดียวกัน (ไฟล์ .duckdb ของ 2.x เปิดด้วย 1.x ไม่ได้)
  - pyarrow
  # wrangling
  - pandas
  - polars
  # profiling & data quality
  - ydata-profiling
  - setuptools<81         # ydata-profiling ยังใช้ pkg_resources
  - pandera
  - missingno
  # visualization
  - seaborn
  - altair
  - vl-convert-python
  - plotly
  - datashader
  # statistics
  - scipy
  - statsmodels
  - ruptures              # change point detection (บทที่ 14)
  - pingouin
  # multivariate & outliers
  - scikit-learn
  - umap-learn
  - pyod
  - imbalanced-learn
  # synthetic data
  - faker
  # spatial
  - geopandas
  - folium
  - libpysal              # spatial weights และ Moran's I (บทที่ 17)
  - esda
  - pykrige
  # communication
  - streamlit
  - papermill             # รายงาน Quarto แบบมีพารามิเตอร์ (บทที่ 19)
  - pip
  - pip:
      - skimpy
      - pygwalker
      - sdv
