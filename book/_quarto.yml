language:
  crossref-fig-title: "ภาพที่"
  crossref-fig-prefix: "ภาพที่"
  crossref-tbl-title: "ตารางที่"
  crossref-tbl-prefix: "ตารางที่"
  crossref-eq-prefix: "สมการ"
  crossref-sec-prefix: "หัวข้อ"
  crossref-ch-prefix: "บทที่"
  crossref-apx-prefix: "ภาคผนวก"
  section-title-appendices: "ภาคผนวก"
  section-title-references: "เอกสารอ้างอิง"
  toc-title-document: "สารบัญ"
  toc-title-website: "ในหน้านี้"
