- term: Hierarchy
  th: ลำดับชั้น
  definition: >
    โครงสร้างต้นไม้ที่แต่ละโหนดมีพ่อแม่หนึ่งโหนดยกเว้นราก เช่น ประเทศ → ภาค → จังหวัด → สถานี
    และ ปี → เดือน → วัน
  section: sec-ch18-hierarchy
- term: Additive measure
  th: ตัวชี้วัดที่รวมขึ้นได้
  definition: >
    ตัวชี้วัดที่ค่าของระดับบนเท่ากับผลรวมของระดับล่าง เช่น จำนวนสถานี-วัน ค่าเฉลี่ยและสัดส่วนทำให้รวมได้ด้วยการเก็บตัวตั้งกับตัวหาร
    ส่วนมัธยฐานรวมขึ้นไม่ได้
  section: sec-ch18-consistency
- term: Treemap / sunburst
  th: treemap / sunburst
  definition: >
    กราฟแสดงลำดับชั้นด้วยสี่เหลี่ยมซ้อนกันหรือวงแหวนซ้อนกัน ขนาดต้องเป็นตัวชี้วัดที่รวมขึ้นได้ ส่วนตัวชี้วัดอื่นใช้เป็นสี
  section: sec-ch18-treemap
- term: Squarified treemap
  th: squarified treemap
  definition: >
    อัลกอริทึมจัดวาง treemap ที่ทำให้สี่เหลี่ยมใกล้จัตุรัสที่สุด แลกกับการไม่รักษาลำดับและความเสถียรเมื่อค่าเปลี่ยน
  section: sec-ch18-treemap
- term: OLAP
  th: OLAP
  definition: >
    การวิเคราะห์ข้อมูลหลายมิติแบบ data cube ด้วยการดำเนินการ roll-up, drill-down, slice, dice และ pivot
  section: sec-ch18-olap
  see_also: [Drill-down]
- term: Drill-down
  th: drill-down
  definition: >
    การลงจากระดับที่หยาบไปยังระดับที่ละเอียดกว่าของลำดับชั้น เช่น จากภาคไปจังหวัด ตรงข้ามกับ roll-up
  section: sec-ch18-olap
