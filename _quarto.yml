            href: weeks/week04/lab.md
          - text: "ปฏิบัติการสัปดาห์ที่ 5"
            href: weeks/week05/lab.md
          - text: "ปฏิบัติการสัปดาห์ที่ 6"
            href: weeks/week06/lab.md
          - text: "ปฏิบัติการสัปดาห์ที่ 7"
            href: weeks/week07/lab.md
          - text: "ปฏิบัติการสัปดาห์ที่ 8"
            href: weeks/week08/lab.md
          - text: "ปฏิบัติการสัปดาห์ที่ 9"
